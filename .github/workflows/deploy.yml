name: Deploy para Hostinger (public_html)

# Dispara automaticamente a cada push na branch main
# e também permite disparar manualmente pela aba "Actions" do GitHub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build e deploy via FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codigo_fonte/package-lock.json

      - name: Instalar dependências
        working-directory: codigo_fonte
        run: npm ci

      - name: Build de produção
        working-directory: codigo_fonte
        run: npm run build

      - name: Deploy para public_html (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Porta 21 = FTPS explícito (TLS). Padrão na Hostinger.
          port: 21
          protocol: ftps
          # Pasta local com o build gerado
          local-dir: codigo_fonte/dist/
          # Pasta de destino na Hostinger
          server-dir: ./
          # Remove no servidor arquivos que não existem mais no build
          dangerous-clean-slate: true
