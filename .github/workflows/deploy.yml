name: Deploy para Hostinger (public_html)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e Deploy (Hostinger)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: codigo_fonte/package-lock.json

      - name: Instalar dependências
        working-directory: codigo_fonte
        run: npm ci

      - name: Build de produção
        working-directory: codigo_fonte
        run: npm run build

      - name: Verificar resultado do build
        working-directory: codigo_fonte
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html não foi gerado."
            exit 1
          fi

          echo "dist/index.html OK — pronto para deploy."

      - name: Deploy para public_html (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          protocol: ftps
          local-dir: codigo_fonte/dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR || '/' }}
          dangerous-clean-slate: false
          dry-run: false
